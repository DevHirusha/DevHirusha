<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="260" height="260" viewBox="0 0 260 260">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="260" height="260" rx="20" ry="20"/>
    </clipPath>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#06b6d4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="260" height="260" rx="20" fill="#0d1117"/>

  <image xlink:href="assets/logo.jpeg" href="assets/logo.jpeg"
         x="0" y="0" width="260" height="260"
         preserveAspectRatio="xMidYMid slice"
         clip-path="url(#rounded)"/>

  <rect x="1" y="1" width="258" height="258" rx="19"
        fill="none" stroke="#06b6d4" stroke-width="2"/>

  <path d="M8 26 V8 H26"       fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <path d="M234 8 H252 V26"    fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <path d="M8 234 V252 H26"    fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <path d="M234 252 H252 V234" fill="none" stroke="#06b6d4" stroke-width="2.5"/>

  <g clip-path="url(#rounded)">
    <rect x="0" y="-12" width="260" height="12"
          fill="url(#scanGrad)" filter="url(#glow)">
      <animate attributeName="y"
               from="-12" to="260"
               dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
